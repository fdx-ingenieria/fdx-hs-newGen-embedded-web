<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/ico" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c1117" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f0f3f7" media="(prefers-color-scheme: light)" />
    <title>FDX-HS · Monitor</title>
    <!-- Apply the theme before first paint to avoid a flash of the wrong palette. -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('fdx-theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.classList.toggle('dark', t === 'dark');
          document.documentElement.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
